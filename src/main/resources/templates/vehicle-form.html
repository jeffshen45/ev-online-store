<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Vehicle</title>
</head>
<body>
    <h1>Add Vehicle</h1>
    <form th:action="@{/vehicles}" th:object="${vehicle}" method="post">
        <p>Make: <input type="text" th:field="*{make}" /></p>
        <p>Model: <input type="text" th:field="*{model}" /></p>
        <p>Year: <input type="number" th:field="*{modelYear}" /></p>
        <p>Price: <input type="number" step="0.01" th:field="*{price}" /></p>
        <p>Mileage: <input type="number" th:field="*{mileage}" /></p>
        <button type="submit">Save</button>
    </form>
    <a th:href="@{/vehicles}">Back to list</a>
</body>
</html>
