
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Vehicle</title>
</head>

<body>

    <h1>Add Vehicle</h1>

    <form th:action="@{/vehicles}"
          th:object="${vehicle}"
          method="post">

        <h3>Basic Information</h3>

        <p>
            Make:
            <input type="text" th:field="*{make}" required />
        </p>

        <p>
            Model:
            <input type="text" th:field="*{model}" required />
        </p>

        <p>
            Year:
            <input type="number" th:field="*{modelYear}" required />
        </p>

        <p>
            Price:
            <input type="number" step="0.01"
                   th:field="*{price}" required />
        </p>

        <p>
            Mileage:
            <input type="number" min="0"
                   th:field="*{mileage}" required />
        </p>

        <h3>Additional Information</h3>

        <p>
            Condition:
            <select th:field="*{condition}" required>
                <option value="">Select condition</option>
                <option value="FACTORY_NEW">Factory New</option>
                <option value="LIGHTLY_USED">Lightly Used</option>
                <option value="USED">Used</option>
            </select>
        </p>

        <p>
            Transmission:
            <select th:field="*{transmission}" required>
                <option value="">Select transmission</option>
                <option value="AUTOMATIC">Automatic</option>
                <option value="MANUAL">Manual</option>
            </select>
        </p>

        <p>
            Fuel Type:
            <select th:field="*{fuelType}" required>
                <option value="">Select fuel type</option>
                <option value="ELECTRIC">Electric</option>
                <option value="HYBRID">Hybrid</option>
            </select>
        </p>

        <p>
            Colour:
            <input type="text" th:field="*{colour}" required />
        </p>

        <p>
            Horsepower:
            <input type="number" min="1"
                   th:field="*{horsepower}" required />
        </p>

        <p>
            Seating Capacity:
            <input type="number" min="1"
                   th:field="*{seatingCapacity}" required />
        </p>

        <p>
            Availability:
            <select th:field="*{availability}" required>
                <option value="AVAILABLE">Available</option>
                <option value="RESERVED">Reserved</option>
                <option value="SOLD">Sold</option>
            </select>
        </p>

        <button type="submit">Save</button>

    </form>

    <a th:href="@{/vehicles}">Back to list</a>

</body>
</html>
