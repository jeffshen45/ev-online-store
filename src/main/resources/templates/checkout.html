<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Checkout</title></head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>
    <h1>Checkout</h1>
    <p th:if="${error}" th:text="${error}" style="color:red"></p>

    <table border="1">
        <tr><th>Vehicle</th><th>Specifications</th><th>Price</th></tr>
        <tr th:each="item : ${items}">
            <td th:text="${item.vehicle.modelYear + ' ' + item.vehicle.make + ' ' + item.vehicle.model}"></td>
            <td><div th:each="s : ${item.selections}" th:text="${s.key + ': ' + s.value}"></div></td>
            <td th:text="${item.unitPrice}"></td>
        </tr>
    </table>
    <p>Total: <strong th:text="${total}"></strong></p>

    <form th:action="@{/checkout}" method="post">
        <h2>Payment</h2>
        <p><label><input type="radio" name="paymentType" value="FULL" checked> Pay in full</label></p>
        <p><label><input type="radio" name="paymentType" value="LOAN"> Finance with a loan (6% APR)</label></p>
        <p>Down payment (%): <input type="number" name="downPercent" value="10" min="0" max="90"></p>
        <p>Loan term:
            <select name="months">
                <option value="24">24 months</option>
                <option value="36">36 months</option>
                <option value="48">48 months</option>
                <option value="60" selected>60 months</option>
                <option value="72">72 months</option>
            </select>
        </p>
        <button type="submit">Place order</button>
    </form>
    <a th:href="@{/cart}">Back to cart</a>
</body>
</html>
