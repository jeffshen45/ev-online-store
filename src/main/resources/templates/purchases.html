<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Purchase History</title></head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>
    <h1>Purchase History</h1>
    <p th:if="${purchases.isEmpty()}">No purchases yet.</p>
    <table border="1" th:unless="${purchases.isEmpty()}">
        <tr><th>Vehicle</th><th>Specifications</th><th>Price</th><th>Payment</th><th>Date</th></tr>
        <tr th:each="p : ${purchases}">
            <td th:text="${p.modelYear + ' ' + p.make + ' ' + p.model}"></td>
            <td><div th:each="s : ${p.selections}" th:text="${s.key + ': ' + s.value}"></div></td>
            <td th:text="${p.finalPrice}"></td>
            <td th:text="${p.paymentType == 'LOAN' ? p.monthlyPayment + '/month for ' + p.loanMonths + ' months' : 'Paid in full'}"></td>
            <td th:text="${#temporals.format(p.purchasedAt, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
    </table>
</body>
</html>
