<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Vehicles</title>
</head>
<body>
    <h1>Vehicle Inventory</h1>
    <p>
    	Sort by price:
    	<a th:href="@{/vehicles(sort='price',dir='asc')}">low to high</a> |
    	<a th:href="@{/vehicles(sort='price',dir='desc')}">high to low</a>
	</p>
	<p>
    	Sort by mileage:
    	<a th:href="@{/vehicles(sort='mileage',dir='asc')}">low to high</a> |
    	<a th:href="@{/vehicles(sort='mileage',dir='desc')}">high to low</a>
	</p>
    <a th:href="@{/vehicles/new}">Add vehicle</a>

    <table border="1">
        <tr>
            <th>Make</th>
            <th>Model</th>
            <th>Year</th>
            <th>Price</th>
            <th>Mileage</th>
            <th>Action</th>
        </tr>
        <tr th:each="v : ${vehicles}">
            <td th:text="${v.make}"></td>
            <td th:text="${v.model}"></td>
            <td th:text="${v.modelYear}"></td>
            <td th:text="${v.price}"></td>
            <td th:text="${v.mileage}"></td>
            <td>
                <form th:action="@{/vehicles/{id}/delete(id=${v.id})}" method="post">
                    <button type="submit" onclick="return confirm('Delete this vehicle?')">Delete</button>
                </form>
            </td>
        </tr>
    </table>
</body>
</html>
