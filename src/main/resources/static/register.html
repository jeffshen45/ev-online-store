<!DOCTYPE html>
<html>
<head>
    <title>EV Store - Register Account</title>
</head>
<body>

    <h1>Customer Registration</h1>
    <p>Please enter your details below to create an account.</p>

    <!-- Registration form for PB9 -->
    <form id="regForm">
        <div>
            <label for="username">Username:</label><br>
            <input type="text" id="username" name="username">
        </div>
        <br>
        <div>
            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email">
        </div>
        <br>
        <div>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password">
        </div>
        <br>
        <div>
            <label for="address">Delivery Address (Optional):</label><br>
            <input type="text" id="address" name="address">
        </div>
        <br>
        <button type="button" onclick="submitRegistration()">Create Account</button>
    </form>

    <br>
    <p><a href="/login.html">Already have an account? Go to Sign In</a></p>

    <hr>

    <h3>Status / Output:</h3>
    <pre id="outputBox">Ready</pre>

    <script>
        // send registration details to our backend endpoint
        async function submitRegistration() {
            const out = document.getElementById("outputBox");
            out.innerText = "Submitting, please wait...";

            // collect form data
            const userDetails = {
                username: document.getElementById("username").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value,
                address: document.getElementById("address").value
            };

            try {
                const response = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(userDetails)
                });

                const result = await response.json();

                if (response.ok) {
                    out.innerText = "Success (Status " + response.status + "):\n" + JSON.stringify(result, null, 2);
                } else {
                    out.innerText = "Error (Status " + response.status + "):\n" + JSON.stringify(result, null, 2);
                }
            } catch (error) {
                out.innerText = "Request failed: " + error.message;
            }
        }
    </script>

</body>
</html>
